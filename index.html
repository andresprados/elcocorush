<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reza's Voucher Hunt</title>
<meta name="description" content="Reza's Voucher Hunt — four treasures, revealed one by one. Good luck!" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     EDIT YOUR TREASURES IN THE <script> AT THE BOTTOM OF THIS FILE
     (unlock dates + reward text live in the TREASURES array)
     ============================================================ */

  :root {
    --sand:        #f4d9a6;
    --sand-deep:   #e9c178;
    --terracotta:  #d65a31;
    --chili:       #c0392b;
    --marigold:    #f5a623;
    --sun:         #ffd23f;
    --teal:        #1fa8a0;
    --teal-deep:   #0e6e74;
    --sea:         #1b8aa0;
    --sea-deep:    #0c5a73;
    --sea-night:   #073a52;
    --cream:       #fff5e1;
    --ink:         #3a2417;
    --pink:        #e84a87;
    --purple:      #7d4bbd;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: 'Baloo 2', system-ui, sans-serif;
    color: var(--ink);
    overflow-x: hidden;
  }

  body {
    background: linear-gradient(180deg,
      #6fd0e0 0%,
      #3fb3c9 28%,
      var(--sea) 50%,
      var(--sea-deep) 75%,
      var(--sea-night) 100%);
    min-height: 100vh;
    position: relative;
  }

  /* ---------- Sun ---------- */
  .sun {
    position: fixed;
    top: 6vh;
    right: 8vw;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--sun) 0%, var(--marigold) 70%, var(--terracotta) 100%);
    box-shadow: 0 0 60px 20px rgba(255,210,63,0.55);
    z-index: 0;
    animation: sun-pulse 6s ease-in-out infinite;
  }
  @keyframes sun-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* ---------- Papel picado banner ---------- */
  .papel {
    position: relative;
    z-index: 5;
    display: flex;
    justify-content: center;
    gap: 0;
    padding: 0;
    margin: 0;
    overflow: hidden;
  }
  .flag {
    width: 9%;
    min-width: 46px;
    height: 58px;
    margin-top: -2px;
    clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%);
    position: relative;
    transform-origin: top center;
    animation: flutter 4s ease-in-out infinite;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,0.06);
  }
  .flag::before {
    content: "";
    position: absolute;
    inset: 10px 14px 22px 14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(255,255,255,0.85) 18%, transparent 19%),
      radial-gradient(circle at 25% 60%, rgba(255,255,255,0.7) 10%, transparent 11%),
      radial-gradient(circle at 75% 60%, rgba(255,255,255,0.7) 10%, transparent 11%);
  }
  .flag:nth-child(5n+1){ background: var(--chili); }
  .flag:nth-child(5n+2){ background: var(--marigold); }
  .flag:nth-child(5n+3){ background: var(--teal); }
  .flag:nth-child(5n+4){ background: var(--pink); }
  .flag:nth-child(5n+5){ background: var(--purple); }
  .flag:nth-child(odd){ animation-delay: -2s; }
  @keyframes flutter {
    0%,100% { transform: rotate(-2deg); }
    50%     { transform: rotate(2deg); }
  }

  /* ---------- Header ---------- */
  header {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 28px 16px 8px;
  }
  h1 {
    font-family: 'Rye', cursive;
    font-size: clamp(2.2rem, 7vw, 4.6rem);
    margin: 0;
    color: var(--cream);
    text-shadow:
      3px 3px 0 var(--chili),
      6px 6px 0 var(--ink),
      0 0 30px rgba(255,210,63,0.5);
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: clamp(1rem, 2.6vw, 1.4rem);
    color: var(--sun);
    font-weight: 600;
    margin: 10px 0 0;
    text-shadow: 1px 1px 0 var(--ink);
  }
  .subtitle .accent { color: var(--cream); }

  /* ---------- Treasure grid ---------- */
  .hunt {
    position: relative;
    z-index: 5;
    max-width: 1080px;
    margin: 30px auto 0;
    padding: 0 18px 40px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  @media (max-width: 640px) {
    .hunt { grid-template-columns: 1fr; }
  }

  .treasure {
    position: relative;
    background: linear-gradient(160deg, var(--cream) 0%, var(--sand) 100%);
    border: 4px solid var(--ink);
    border-radius: 22px;
    padding: 26px 22px 28px;
    box-shadow: 0 12px 0 rgba(0,0,0,0.25), 0 18px 40px rgba(0,0,0,0.3);
    text-align: center;
    overflow: hidden;
    transition: transform 0.25s ease;
  }
  .treasure:hover { transform: translateY(-6px) rotate(-0.5deg); }

  /* decorative serape stripe top */
  .treasure::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 10px;
    background: repeating-linear-gradient(90deg,
      var(--chili) 0 14px,
      var(--marigold) 14px 28px,
      var(--teal) 28px 42px,
      var(--pink) 42px 56px,
      var(--purple) 56px 70px);
  }

  .treasure .num {
    display: inline-block;
    font-family: 'Rye', cursive;
    font-size: 0.9rem;
    background: var(--ink);
    color: var(--sun);
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .chest {
    font-size: 3.4rem;
    line-height: 1;
    margin: 6px 0 4px;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.25));
  }
  .treasure h2 {
    font-family: 'Baloo 2';
    font-weight: 800;
    font-size: 1.45rem;
    margin: 6px 0 2px;
    color: var(--terracotta);
  }
  .treasure .hint {
    font-size: 0.95rem;
    color: var(--ink);
    opacity: 0.75;
    margin: 0 0 14px;
    min-height: 1.2em;
  }

  /* ---------- Countdown ---------- */
  .countdown {
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  .unit {
    background: var(--teal-deep);
    color: var(--cream);
    border-radius: 12px;
    padding: 10px 6px 6px;
    min-width: 58px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.25);
  }
  .unit .val {
    font-family: 'Rye', cursive;
    font-size: 1.7rem;
    line-height: 1;
    display: block;
  }
  .unit .lab {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.85;
  }

  /* ---------- Locked / Revealed states ---------- */
  .locked-msg {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--sand-deep);
    border: 2px dashed var(--ink);
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 600;
    color: var(--ink);
  }

  /* ---------- Open button ---------- */
  .open-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--cream);
    background: linear-gradient(160deg, var(--terracotta) 0%, var(--chili) 100%);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 12px 26px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    animation: wiggle 1s ease-in-out infinite;
  }
  .open-btn:hover  { transform: translateY(-2px); }
  .open-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
  @keyframes wiggle {
    0%,100% { transform: rotate(-2deg) scale(1); }
    50%     { transform: rotate(2deg) scale(1.05); }
  }
  .treasure.is-ready .chest { animation: bounce 0.9s ease infinite; cursor: pointer; }

  .reward {
    display: none;
    margin-top: 6px;
    background: linear-gradient(160deg, #fff 0%, var(--sun) 130%);
    border: 3px solid var(--marigold);
    border-radius: 14px;
    padding: 14px 12px;
    animation: pop 0.5s cubic-bezier(.2,1.3,.4,1) both;
  }
  .reward .code {
    font-family: 'Rye', cursive;
    font-size: 1.5rem;
    color: var(--chili);
    letter-spacing: 2px;
    word-break: break-word;
  }
  .reward .desc { font-size: 0.92rem; margin-top: 4px; color: var(--ink); }

  .treasure.is-unlocked { animation: chest-open 0.6s ease both; }
  .treasure.is-unlocked .chest { animation: bounce 1.2s ease infinite; }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes bounce { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-8px);} }
  @keyframes chest-open {
    0% { box-shadow: 0 0 0 rgba(255,210,63,0); }
    50%{ box-shadow: 0 0 60px 16px rgba(255,210,63,0.8); }
    100%{ box-shadow: 0 12px 0 rgba(0,0,0,0.25), 0 18px 40px rgba(0,0,0,0.3); }
  }

  /* ---------- Island ---------- */
  .island {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    width: 260px;
    max-width: 60vw;
    pointer-events: none;
    opacity: 0.96;
  }
  .island .palm-sway { transform-origin: 130px 150px; animation: sway 5s ease-in-out infinite; }
  @keyframes sway {
    0%,100% { transform: rotate(-3deg); }
    50%     { transform: rotate(3deg); }
  }

  /* ---------- Fish & bubbles ---------- */
  .ocean-life {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .fish {
    position: absolute;
    will-change: transform;
    animation-name: swim;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .fish.rtl { animation-name: swim-rtl; }
  @keyframes swim {
    from { transform: translateX(-20vw) translateY(0); }
    50%  { transform: translateX(60vw) translateY(-18px); }
    to   { transform: translateX(130vw) translateY(0); }
  }
  @keyframes swim-rtl {
    from { transform: translateX(130vw) scaleX(-1) translateY(0); }
    50%  { transform: translateX(50vw) scaleX(-1) translateY(16px); }
    to   { transform: translateX(-20vw) scaleX(-1) translateY(0); }
  }
  .bubble {
    position: absolute;
    bottom: -40px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.15));
    animation: rise linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.8; }
    to   { transform: translateY(-105vh) translateX(20px); opacity: 0; }
  }

  /* ---------- Footer ---------- */
  footer {
    position: relative;
    z-index: 5;
    text-align: center;
    color: var(--cream);
    padding: 10px 16px 130px;
    font-size: 0.9rem;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
  }

  /* ---------- Full-screen reveal (lightbox) ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 78px 16px 24px;
    background: rgba(7, 58, 82, 0.94);
    backdrop-filter: blur(4px);
  }
  .lightbox.show { display: flex; animation: fade 0.35s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .lb-img {
    max-width: 96vw;
    max-height: 84vh;
    border: 5px solid var(--cream);
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.6), 0 0 60px rgba(255,210,63,0.35);
    animation: pop 0.5s cubic-bezier(.2,1.3,.4,1) both;
  }
  .lb-back {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 101;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    color: var(--cream);
    background: linear-gradient(160deg, var(--terracotta) 0%, var(--chili) 100%);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.35);
  }
  .lb-back:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  .lb-caption {
    position: fixed;
    bottom: 22px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Rye', cursive;
    font-size: clamp(1.1rem, 3.5vw, 1.8rem);
    color: var(--sun);
    text-shadow: 2px 2px 0 var(--ink);
    pointer-events: none;
  }

  /* reward image shown on the card after "Back" */
  .reward-img {
    width: 100%;
    border-radius: 12px;
    border: 3px solid var(--ink);
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    cursor: pointer;
    display: block;
    margin: 4px 0 2px;
    transition: transform 0.2s ease;
  }
  .reward-img:hover { transform: scale(1.02); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>

  <div class="sun" aria-hidden="true"></div>

  <!-- Background ocean life -->
  <div class="ocean-life" id="oceanLife" aria-hidden="true"></div>

  <!-- Papel picado banner -->
  <div class="papel" aria-hidden="true">
    <div class="flag"></div><div class="flag"></div><div class="flag"></div>
    <div class="flag"></div><div class="flag"></div><div class="flag"></div>
    <div class="flag"></div><div class="flag"></div><div class="flag"></div>
    <div class="flag"></div><div class="flag"></div>
  </div>

  <header>
    <h1>Reza's Voucher Hunt</h1>
    <p class="subtitle">Four treasures hidden on the island &mdash; <span class="accent">revealed one by one!</span></p>
  </header>

  <main class="hunt" id="hunt"><!-- treasures injected by JS --></main>

  <!-- Full-screen treasure reveal -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-back" id="lbBack" type="button">&larr; Back</button>
    <img class="lb-img" id="lbImg" alt="Treasure reveal" />
    <div class="lb-caption" id="lbCaption"></div>
  </div>

  <footer>
    🌵 Made with love &middot; Stay tuned &mdash; the tide reveals all 🐠
  </footer>

  <!-- Island -->
  <svg class="island" viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <ellipse cx="130" cy="168" rx="120" ry="16" fill="#0c5a73" opacity="0.5"/>
    <path d="M40 168 Q130 120 220 168 Z" fill="#e9c178"/>
    <path d="M55 168 Q130 138 205 168 Z" fill="#f4d9a6"/>
    <g class="palm-sway">
      <rect x="124" y="92" width="12" height="62" rx="6" fill="#8a5a2b"/>
      <path d="M130 96 Q90 70 60 86 Q92 80 130 100 Z" fill="#1fa8a0"/>
      <path d="M130 96 Q170 70 200 86 Q168 80 130 100 Z" fill="#15938c"/>
      <path d="M130 94 Q104 58 86 40 Q120 66 132 96 Z" fill="#1fa8a0"/>
      <path d="M130 94 Q156 58 176 42 Q140 66 130 96 Z" fill="#178f88"/>
      <circle cx="120" cy="86" r="6" fill="#8a5a2b"/>
      <circle cx="140" cy="88" r="6" fill="#a86a30"/>
    </g>
  </svg>

  <script>
  /* ============================================================
     >>> EDIT YOUR TREASURES HERE <<<
     - unlockISO : when the treasure unveils (ISO date-time, local time).
                   Format: "YYYY-MM-DDTHH:MM:SS"
     - title     : the name of the treasure
     - hint      : a little teaser shown before it unlocks
     - code      : the voucher code revealed on unlock
     - desc      : description of the reward
     - chest     : the emoji shown on the card
     The FIRST treasure shows the big live countdown.
     ============================================================ */
  const TREASURES = [
    {
      chest: "🎁",
      title: "The First Treasure",
      hint: "The hunt begins! Watch the sand timer run out…",
      unlockISO: "2026-08-01T00:00:00",
      image: "first treasure.jpeg",   // full-screen reveal image
      revealTitle: "SUP Walensee Treasure",
      code: "REZA-UNO-2026",
      desc: "Your first voucher is yours. Congratulations!"
    },
    {
      // "Coming soon" — set a real unlockISO date when you're ready to schedule it.
      chest: "🏝️",
      title: "The Second Treasure",
      hint: "Buried deeper in the dunes.",
      unlockISO: "2099-01-01T00:00:00",
      code: "REZA-DOS-2026",
      desc: "A second reward washes ashore."
    },
    {
      // "Coming soon" — set a real unlockISO date when you're ready to schedule it.
      chest: "🐚",
      title: "The Third Treasure",
      hint: "Guarded by the reef.",
      unlockISO: "2099-01-01T00:00:00",
      code: "REZA-TRES-2026",
      desc: "Three down — keep going!"
    },
    {
      // "Coming soon" — set a real unlockISO date when you're ready to schedule it.
      chest: "💎",
      title: "The Grand Treasure",
      hint: "The grand prize of the hunt.",
      unlockISO: "2099-01-01T00:00:00",
      code: "REZA-ORO-2026",
      desc: "The legendary final treasure is revealed!"
    }
  ];

  /* ---------------- Render cards ---------------- */
  const hunt = document.getElementById("hunt");

  TREASURES.forEach((t, i) => {
    const card = document.createElement("article");
    card.className = "treasure";
    card.dataset.index = i;

    const big = i === 0; // first treasure gets the live countdown
    card.innerHTML = `
      <span class="num">Treasure ${i + 1} of ${TREASURES.length}</span>
      <div class="chest">${t.chest}</div>
      <h2>${t.title}</h2>
      <p class="hint">${t.hint}</p>
      <div class="state">
        ${big
          ? `<div class="countdown" data-cd="${i}">
               <div class="unit"><span class="val" data-d>--</span><span class="lab">Days</span></div>
               <div class="unit"><span class="val" data-h>--</span><span class="lab">Hours</span></div>
               <div class="unit"><span class="val" data-m>--</span><span class="lab">Min</span></div>
               <div class="unit"><span class="val" data-s>--</span><span class="lab">Sec</span></div>
             </div>`
          : `<span class="locked-msg">🔒 Coming soon&hellip;</span>`}
      </div>
      <div class="reward" data-reward="${i}">
        <div class="code">${t.code}</div>
        <div class="desc">${t.desc}</div>
      </div>
    `;
    hunt.appendChild(card);
  });

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function pad(n) { return String(n).padStart(2, "0"); }

  /* ---------------- Countdown / unlock loop ---------------- */
  // Time's up: show the "Open" button. The gift stays closed until clicked.
  function arm(i) {
    const card = hunt.querySelector(`.treasure[data-index="${i}"]`);
    if (!card || card.classList.contains("is-ready") || card.classList.contains("is-unlocked")) return;
    card.classList.add("is-ready");
    const state = card.querySelector(".state");
    if (state) {
      state.innerHTML = `<button class="open-btn" type="button">🎁 Tap to open!</button>`;
      state.querySelector(".open-btn").addEventListener("click", () => reveal(i));
    }
    const chest = card.querySelector(".chest");
    if (chest) chest.addEventListener("click", () => reveal(i));
    const hint = card.querySelector(".hint");
    if (hint) hint.textContent = "The wait is over — open your gift!";
  }

  // Actually reveal the treasure (triggered by the user's click).
  function reveal(i) {
    const t = TREASURES[i];
    const card = hunt.querySelector(`.treasure[data-index="${i}"]`);
    if (!card || card.classList.contains("is-unlocked")) return;
    card.classList.remove("is-ready");
    card.classList.add("is-unlocked");
    burst(card);

    if (t.image) {
      // Pop the gift image full-screen; the card transforms when "Back" is pressed.
      openLightbox(t.image, t.revealTitle, () => transformCard(i));
      return;
    }

    // Fallback: reveal a voucher code inline (treasures without an image).
    const reward = card.querySelector(`[data-reward="${i}"]`);
    if (reward) reward.style.display = "block";
    const state = card.querySelector(".state");
    if (state) state.innerHTML = `<span class="locked-msg" style="background:var(--teal);color:#fff;border-style:solid;border-color:var(--teal-deep)">🎉 Unlocked!</span>`;
    const hint = card.querySelector(".hint");
    if (hint) hint.textContent = "The treasure is yours — claim it below!";
  }

  // Turn the card itself into the picture + reveal title (after "Back").
  function transformCard(i) {
    const t = TREASURES[i];
    const card = hunt.querySelector(`.treasure[data-index="${i}"]`);
    if (!card) return;
    const chest = card.querySelector(".chest");
    if (chest) {
      const img = document.createElement("img");
      img.className = "reward-img";
      img.src = encodeURI(t.image);
      img.alt = t.revealTitle || t.title;
      img.addEventListener("click", () => openLightbox(t.image, t.revealTitle, null));
      chest.replaceWith(img);
    }
    const h2 = card.querySelector("h2");
    if (h2) h2.textContent = t.revealTitle || t.title;
    const state = card.querySelector(".state");
    if (state) state.innerHTML = "";
    const reward = card.querySelector(`[data-reward="${i}"]`);
    if (reward) reward.style.display = "none";
    const hint = card.querySelector(".hint");
    if (hint) hint.textContent = "Tap the picture to open it full-screen.";
  }

  /* ---------------- Full-screen lightbox ---------------- */
  const lightbox   = document.getElementById("lightbox");
  const lbImg      = document.getElementById("lbImg");
  const lbCaption  = document.getElementById("lbCaption");
  let   lbOnClose  = null;

  function openLightbox(src, caption, onClose) {
    lbImg.src = encodeURI(src);
    lbCaption.textContent = caption || "";
    lbOnClose = onClose;
    lightbox.classList.add("show");
    lightbox.setAttribute("aria-hidden", "false");
  }
  function closeLightbox() {
    lightbox.classList.remove("show");
    lightbox.setAttribute("aria-hidden", "true");
    const cb = lbOnClose;
    lbOnClose = null;
    if (cb) cb();
  }
  document.getElementById("lbBack").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && lightbox.classList.contains("show")) closeLightbox();
  });

  function tick() {
    const now = Date.now();
    TREASURES.forEach((t, i) => {
      const target = new Date(t.unlockISO).getTime();
      const diff = target - now;
      const card = hunt.querySelector(`.treasure[data-index="${i}"]`);

      if (diff <= 0) { arm(i); return; }

      // update live countdown (first card only)
      const cd = card.querySelector(`.countdown[data-cd="${i}"]`);
      if (cd) {
        const days = Math.floor(diff / 86400000);
        const hrs  = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        cd.querySelector("[data-d]").textContent = days;
        cd.querySelector("[data-h]").textContent = pad(hrs);
        cd.querySelector("[data-m]").textContent = pad(mins);
        cd.querySelector("[data-s]").textContent = pad(secs);
      }
    });
  }
  tick();
  setInterval(tick, 1000);

  /* ---------------- Confetti burst on unlock ---------------- */
  function burst(card) {
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 3;
    const colors = ["#d65a31","#f5a623","#1fa8a0","#e84a87","#7d4bbd","#ffd23f"];
    for (let k = 0; k < 28; k++) {
      const p = document.createElement("div");
      const size = 6 + Math.random() * 8;
      p.style.cssText = `position:fixed;z-index:50;left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;
        background:${colors[k % colors.length]};border-radius:${Math.random()>.5?'50%':'2px'};
        pointer-events:none;`;
      document.body.appendChild(p);
      const ang = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 160;
      const dx = Math.cos(ang) * dist;
      const dy = Math.sin(ang) * dist - 60;
      p.animate(
        [{ transform: "translate(0,0) rotate(0)", opacity: 1 },
         { transform: `translate(${dx}px,${dy + 200}px) rotate(${Math.random()*720}deg)`, opacity: 0 }],
        { duration: 1400 + Math.random() * 800, easing: "cubic-bezier(.2,.7,.3,1)" }
      ).onfinish = () => p.remove();
    }
  }

  /* ---------------- Background fish + bubbles ---------------- */
  const FISH = ["🐠","🐟","🐡","🦈","🐙","🦀","🐬"];
  const life = document.getElementById("oceanLife");

  function spawnFish() {
    for (let i = 0; i < 12; i++) {
      const f = document.createElement("div");
      f.className = "fish" + (Math.random() > 0.5 ? " rtl" : "");
      f.textContent = FISH[Math.floor(Math.random() * FISH.length)];
      const size = 18 + Math.random() * 34;
      f.style.fontSize = size + "px";
      f.style.top = (8 + Math.random() * 82) + "vh";
      const dur = 14 + Math.random() * 26;
      f.style.animationDuration = dur + "s";
      f.style.animationDelay = (-Math.random() * dur) + "s";
      f.style.opacity = 0.55 + Math.random() * 0.45;
      life.appendChild(f);
    }
  }
  function spawnBubbles() {
    for (let i = 0; i < 24; i++) {
      const b = document.createElement("div");
      b.className = "bubble";
      const size = 6 + Math.random() * 18;
      b.style.width = size + "px";
      b.style.height = size + "px";
      b.style.left = Math.random() * 100 + "vw";
      const dur = 7 + Math.random() * 12;
      b.style.animationDuration = dur + "s";
      b.style.animationDelay = (-Math.random() * dur) + "s";
      b.style.opacity = 0.3 + Math.random() * 0.4;
      life.appendChild(b);
    }
  }
  spawnFish();
  spawnBubbles();
  </script>
</body>
</html>
